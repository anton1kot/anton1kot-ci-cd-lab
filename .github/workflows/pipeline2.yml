name: Pipeline2

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu:latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: HTML lint
        run: |
          npm install -g htmlhint
          htmlhint index.html

      - name: Docker build
        run: docker build -t my-site:ci .

      - name: Docker run
        run: docker run -d -p 8080:80 my-site:ci

      - name: Docker rm
        run: docker rm -f mi-site:ci

